name: Application CI-CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/app-cicd.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Verify Dockerfiles exist
      - name: Check Dockerfile paths
        run: |
          echo "Repository root:"
          pwd

          echo "Frontend files:"
          ls -la app/frontend

          echo "Backend files:"
          ls -la app/backend

          test -f app/frontend/Dockerfile
          test -f app/backend/Dockerfile

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build frontend Docker image
      - name: Build frontend image
        run: |
          docker build \
            -f app/frontend/Dockerfile \
            -t $ECR_REGISTRY/${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }} \
            -t $ECR_REGISTRY/${{ vars.ECR_FRONTEND_REPOSITORY }}:latest \
            app/frontend

      # 7. Build backend Docker image
      - name: Build backend image
        run: |
          docker build \
            -f app/backend/Dockerfile \
            -t $ECR_REGISTRY/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ github.sha }} \
            -t $ECR_REGISTRY/${{ vars.ECR_BACKEND_REPOSITORY }}:latest \
            app/backend

      # 8. Push frontend image to ECR
      - name: Push frontend image
        run: |
          docker push $ECR_REGISTRY/${{ vars.ECR_FRONTEND_REPOSITORY }}:${{ github.sha }}
          docker push $ECR_REGISTRY/${{ vars.ECR_FRONTEND_REPOSITORY }}:latest

      # 9. Push backend image to ECR
      - name: Push backend image
        run: |
          docker push $ECR_REGISTRY/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
          docker push $ECR_REGISTRY/${{ vars.ECR_BACKEND_REPOSITORY }}:latest

      # 10. Trigger ECS deployment
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --service ${{ vars.ECS_SERVICE_NAME }} \
            --force-new-deployment

      # 11. Wait for ECS service to become stable
      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER_NAME }} \
            --services ${{ vars.ECS_SERVICE_NAME }}

      # 12. Deployment confirmation
      - name: Deployment completed
        run: |
          echo "Frontend and backend images pushed to ECR."
          echo "ECS deployment completed."
